apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-sum

spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-sum
  template:
    metadata:
      labels:
        app: calculator-sum
    spec:
      containers:
        - name: calculator-sum-container
          image: 192.168.10.211:5000/calculator-sum
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
