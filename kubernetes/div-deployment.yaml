apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-div

spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-div
  template:
    metadata:
      labels:
        app: calculator-div
    spec:
      containers:
        - name: calculator-div-container
          image: 192.168.10.211:5000/calculator-div
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
