apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-mul

spec:
  replicas: 1
  selector:
    matchLabels:
      app: calculator-mul
  template:
    metadata:
      labels:
        app: calculator-mul
    spec:
      containers:
        - name: calculator-mul-container
          image: 192.168.10.211:5000/calculator-mul
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
